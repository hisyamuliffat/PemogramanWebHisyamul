<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>
            
            <!-- BAGIAN PENCARIAN & TOMBOL MUAT ULANG -->
            <div class="search-box">
                <select id="filter-column">
                    <option value="all">Semua Kolom</option>
                    <option value="0">Judul</option>
                    <option value="1">Pengarang</option>
                    <option value="2">Tahun</option>
                    <option value="3">Stok</option>
                    <option value="4">Kategori</option> <!-- Opsi Filter Kategori Ditambahkan -->
                </select>
                
                <input type="text" id="search-input" placeholder="Ketik kata kunci pencarian...">
                
                <!-- Tombol Muat Ulang -->
                <button type="button" id="btn-reload" class="btn-secondary">Muat Ulang</button>
            </div>

            <!-- Counter Jumlah Baris -->
            <p id="row-counter" class="row-counter"></p>

            <p id="loading-indicator" style="display:none;">Memuat data...</p>

            <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Judul</th>
                        <th>Pengarang</th>
                        <th>Tahun</th>
                        <th>Stok</th>
                        <th>Kategori</th> <!-- Header Kolom Ditambahkan -->
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
